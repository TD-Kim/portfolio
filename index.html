<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="Java · Spring Boot 백엔드 개발자 김진용의 포트폴리오" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="progress" aria-hidden="true"></div>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="cursor-glow" aria-hidden="true"></div>

  <header class="nav">
    <a href="#top" class="logo" data-name-en></a>
    <nav>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#learning">Learning</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <p class="hello mono">$ whoami</p>
      <h1 class="hero-title"><span data-name></span></h1>
      <p class="hero-role"><span class="typed"></span><span class="caret">|</span></p>
      <p class="hero-tagline" data-tagline></p>
      <div class="hero-cta">
        <a href="#projects" class="btn btn-primary magnetic">프로젝트 보기</a>
        <a href="#contact" class="btn btn-ghost magnetic">연락하기</a>
      </div>
      <a href="#about" class="scroll-hint" aria-label="아래로 스크롤"><span></span></a>
    </section>

    <section id="about" class="section">
      <h2 class="section-title reveal"><span class="num mono">01</span> About</h2>
      <div class="about-grid">
        <div class="about-text reveal"></div>
        <div class="stats reveal"></div>
      </div>
      <div class="marquee reveal" aria-label="기술 스택"><div class="marquee-track"></div></div>
    </section>

    <section id="projects" class="section">
      <h2 class="section-title reveal"><span class="num mono">02</span> Projects</h2>
      <div class="projects"></div>
    </section>

    <section id="experience" class="section">
      <h2 class="section-title reveal"><span class="num mono">03</span> Experience</h2>
      <div class="exp-grid">
        <ol class="timeline"></ol>
        <div class="creds reveal">
          <h3 class="creds-title mono">Education · Certificates</h3>
          <ul class="creds-list"></ul>
        </div>
      </div>
    </section>

    <section id="learning" class="section">
      <h2 class="section-title reveal"><span class="num mono">04</span> Now Learning</h2>
      <p class="section-lead reveal">회사 밖에서 혼자 공부하고 도전하고 있는 것들입니다.</p>
      <div class="projects learning"></div>
    </section>

    <section id="contact" class="section contact">
      <h2 class="section-title reveal"><span class="num mono">05</span> Contact</h2>
      <p class="contact-lead reveal">함께 일하고 싶거나 궁금한 점이 있다면 편하게 연락주세요.</p>
      <a class="contact-email reveal magnetic" data-email></a>
      <div class="contact-links reveal"></div>
    </section>
  </main>

  <footer class="footer mono">© <span data-year></span> <span data-name-en></span></footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
